<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />
  <link href="https://fonts.google.com/specimen/Libre+Franklin" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Ping coming soon page</title>
</head>
<body>
  <main>
    <img class="logo" src="./images/logo.svg" alt="">
    <h1>
      We are launching<span> soon!</span>
    </h1>
    <p class="suscribe">
      Subscribe and get notified
    </p>
    <form class="form" novalidate>
      <div class="input-email">
        <label for="email" class="email"></label>
        <input id="email" type="email" placeholder="Your email address...">
      </div>
      <button type="button" class="btn-noti">Notify Me</button>
    </form>
    <p class="success-message">Your email has been registered!</p>
    <p class="error-message">Please provide a valid email address</p>
    <img class="dashboard" src="./images/illustration-dashboard.png" alt="">
    <div class="social-list">
      <a href="#" class="btn-facebook" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
      <a href="#" class="btn-twitter" aria-label="Twitter">
        <i class="fa-brands fa-twitter"></i>
      </a>
      <a href="#" class="btn-insta" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
    </div>
    <footer>
      &copy; Copyright Ping. All rights reserved.
    </footer>
  </main>
  <script>
    const emailInput = document.getElementById('email');
    const errorMessage = document.querySelector('.error-message');
    const btnNoti = document.querySelector('.btn-noti');
    const successMessage = document.querySelector('.success-message');

    btnNoti.addEventListener('click', function(){
      const mail = emailInput.value;
      if (mail === "" || !emailInput.checkValidity()){
        errorMessage.style.display = "block";
        successMessage.style.display = "none";
        return;
      }
      errorMessage.style.display = "none";
      successMessage.style.display = "block";
      emailInput.value = "";
    })
  </script>
</body>
</html>
