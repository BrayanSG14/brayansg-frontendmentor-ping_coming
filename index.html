<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />
  <link href="https://fonts.google.com/specimen/Libre+Franklin" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Ping coming soon page</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./images/logo.svg" alt="">
    <h1>
      We are launching<span> soon!</span>
    </h1>
    <p class="suscribe">
      Subscribe and get notified
    </p>
    <form class="form" novalidate>
      <div class="input-email">
        <label for="email" class="sr-only">Email address</label>
        <input id="email" type="email" placeholder="Your email address...">
        <p class="error-message">Please provide a valid email address</p>
      </div>
      <button class="btn-noti">Notify Me</button>
    </form>
    <img class="dashboard" src="./images/illustration-dashboard.png" alt="">
    <div class="social-list">
      <a href="#" class="btn-facebook" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
      <a href="#" class="btn-twitter" aria-label="Twitter">
        <i class="fa-brands fa-twitter"></i>
      </a>
      <a href="#" class="btn-insta" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
    </div>
    <footer>
      &copy; Copyright Ping. All rights reserved.
    </footer>
  </main>
  <script>
    const form = document.querySelector(".form");
    const emailInput = document.querySelector("#email");
    form.addEventListener("submit", function(event) {
        event.preventDefault();
        const email = emailInput.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const esValido = emailRegex.test(email);
        if (!esValido) {
            form.classList.add("has-error");
        } else {
            form.classList.remove("has-error");
        }
    });
  </script>
</body>
</html>
